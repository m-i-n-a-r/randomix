[versions]
agp = "9.4.1"

material = "1.14.0"
appcompat = "1.8.0"
activity = "1.13.0"
fragment = "1.9.1"
constraintlayout = "2.2.2"
navigation = "2.10.2"
preference = "1.2.1"
appintro = "6.3.1"
gson = "2.14.0"
splashscreen = "1.2.0"

junit = "4.13.2"
androidx-test-ext-junit = "1.3.0"
espresso-core = "3.7.0"

[libraries]
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
# Pinned on purpose: navigation alone pulls a fragment without predictive back animations
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
navigation-ui = { group = "androidx.navigation", name = "navigation-ui", version.ref = "navigation" }
preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
appintro = { group = "com.github.AppIntro", name = "AppIntro", version.ref = "appintro" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
versions = { id = "com.github.ben-manes.versions", version = "0.64.0" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update",  version = "1.1.1" }
